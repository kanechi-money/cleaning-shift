<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>清掃シフト帳</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
body{margin:0;font-size:14px}#authf label{display:grid;gap:4px}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one narrow column, phone-first; sticky role bar; day-grouped cleaning cards like a housekeeping roster */
:root{
  --bg:#F2F4F1;--surface:#FFFFFF;--ink:#1D2724;--muted:#5F6B67;--line:#DCE2DE;
  --accent:#1E6B62;--accent-ink:#FFFFFF;--accent-soft:#E1EFEC;
  --air:#C8455A;--bkg:#2D5AA0;--warn:#A85F0C;--warn-soft:#FBEFD9;--ok:#2E7D4F;--ok-soft:#E2F2E7;--danger:#C2302F;--danger-soft:#FBE4E2;
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A18;--surface:#1C2421;--ink:#E6ECE9;--muted:#9AA7A2;--line:#2C3733;
  --accent:#5FB8AB;--accent-ink:#0E1A17;--accent-soft:#1F3531;
  --air:#E57A8B;--bkg:#7FA3E0;--warn:#E0A456;--warn-soft:#3A2E1C;--ok:#6CC08E;--ok-soft:#1E3326;--danger:#F08A80;--danger-soft:#3D1F1D;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A18;--surface:#1C2421;--ink:#E6ECE9;--muted:#9AA7A2;--line:#2C3733;
  --accent:#5FB8AB;--accent-ink:#0E1A17;--accent-soft:#1F3531;
  --air:#E57A8B;--bkg:#7FA3E0;--warn:#E0A456;--warn-soft:#3A2E1C;--ok:#6CC08E;--ok-soft:#1E3326;--danger:#F08A80;--danger-soft:#3D1F1D;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-size:1.35rem;margin:0;letter-spacing:.02em}
.demo{font-size:.75rem;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:99px}
.roles{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);padding:7px 14px;font:inherit;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select,input[type=number],input[type=text],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{width:100%;box-sizing:border-box;min-height:120px;font-family:var(--font-num);font-size:.8rem}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.tabs button{border:0;background:none;font:inherit;color:var(--muted);padding:6px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.summary{display:flex;gap:16px;margin-block:16px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.summary b{font-family:var(--font-num);font-size:1.4rem;color:var(--ink);margin-right:4px}
.summary .alert b{color:var(--warn)}
.day{margin-top:18px}
.day h2{font-size:.85rem;color:var(--muted);margin:0 0 6px;font-weight:700;letter-spacing:.04em;display:flex;gap:8px;align-items:center}
.day h2 .rel{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;margin-bottom:8px}
.card.tap{cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.prop{font-weight:700}
.chip{font-size:.72rem;padding:1px 8px;border-radius:99px;border:1px solid currentColor;font-weight:500}
.chip.airbnb{color:var(--air)}.chip.booking{color:var(--bkg)}.chip.manual{color:var(--muted)}
.facts{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem}
.facts span b{font-family:var(--font-num);font-weight:500}
.missing{color:var(--warn)}
.pill{font-size:.75rem;padding:2px 10px;border-radius:99px;font-weight:700}
.pill.open{background:var(--warn-soft);color:var(--warn)}
.pill.set{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.same{color:var(--danger);font-weight:700}
.supp{font-size:.85rem;color:var(--muted)}.supp b{font-family:var(--font-num);color:var(--ink)}.supp .add{color:var(--accent)}
.prep{font-size:1rem}.prep .lbl{font-size:.75rem;color:var(--muted);letter-spacing:.04em;margin-right:4px}.prep b{font-family:var(--font-num);font-size:1.15rem}
.flag{border-radius:8px;padding:8px 10px;font-size:.88rem;display:grid;gap:6px}
.flag.red{background:var(--danger-soft);color:var(--danger)}.flag.amber{background:var(--warn-soft);color:var(--warn)}
.flag button{justify-self:start;font:inherit;font-size:.8rem;font-weight:700;border:1px solid currentColor;background:none;color:inherit;border-radius:8px;padding:3px 10px;cursor:pointer}
.card:has(.flag.red){border-color:var(--danger)}.card:has(.flag.amber){border-color:var(--warn)}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:5px 12px;font-size:.85rem}
.empty{color:var(--muted);text-align:center;padding:32px 8px;border:1px dashed var(--line);border-radius:12px}
.sect{margin-top:22px}
.sect>h3{font-family:var(--font-display);font-size:1.05rem;margin:0 0 8px}
.note{font-size:.82rem;color:var(--muted)}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:8px;align-items:center}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.shot{display:grid;gap:4px;align-content:start;font-size:.82rem}
.shot img,.shot .ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;max-width:100%}
.shot .ph{display:grid;place-items:center;border:1px dashed var(--line);color:var(--muted);font-size:.75rem;position:relative;overflow:hidden}
.shot .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;border-radius:0}
.shot .ph b{position:relative;background:var(--surface);color:var(--ink);padding:1px 8px;border-radius:99px;font-weight:700}
.dsec{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.dsec h5{margin:0;font-size:.95rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dsec h5 small{font-weight:400;color:var(--muted);font-size:.8rem}
.alerts{display:grid;gap:8px;margin-top:16px}
.alert-card{border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.alert-card.red{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)}
.alert-card.amber{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.alert-card .body{color:var(--ink)}
.alert-card .row button{font:inherit;font-size:.8rem;font-weight:700;border:1px solid currentColor;background:var(--surface);color:inherit;border-radius:8px;padding:3px 10px;cursor:pointer}
.tr-item{background:var(--danger-soft);border-radius:8px;padding:8px 10px;display:grid;gap:6px;font-size:.9rem}
.tr-item .t{color:var(--danger);font-weight:700}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:6px}
.btn.danger{background:var(--danger);color:#fff}
.lh{font-weight:700;font-size:.85rem;color:var(--accent);margin-top:8px;border-bottom:1px solid var(--line);padding-bottom:2px}
.hint{font-size:.72rem;color:var(--muted)}
.req{font-size:.7rem;font-weight:700;color:var(--danger);background:var(--danger-soft);padding:1px 8px;border-radius:99px}
.opt{font-size:.7rem;font-weight:700;color:var(--muted);border:1px solid var(--line);padding:0 7px;border-radius:99px}
details.hist .card{opacity:.6}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:10px}
.cw{text-align:center;font-size:.75rem;color:var(--muted)}
.cd{aspect-ratio:1/1.15;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:3px 4px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;font:inherit;cursor:pointer;min-width:0;position:relative;color:var(--ink)}
.cd.empty{border:0;background:none;cursor:default}
.cd .dn{font-size:.75rem;font-family:var(--font-num)}
.cd .g{font-size:.68rem;font-weight:700}
.cd.occ.airbnb,.sw.airbnb{background:color-mix(in srgb,var(--air) 24%,var(--surface))}
.cd.occ.booking,.sw.booking{background:color-mix(in srgb,var(--bkg) 24%,var(--surface))}
.cd.occ.manual,.sw.manual{background:color-mix(in srgb,var(--muted) 24%,var(--surface))}
.cd.today{outline:2px solid var(--accent);outline-offset:-1px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;box-sizing:border-box;position:absolute;bottom:4px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend .dot{position:static}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px}
.lowtag{font-size:.72rem;color:var(--warn);font-weight:700}
details.refs summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:.9rem}
details.refs .shots{margin-top:8px}
.shot.ok .sl::before{content:"✓ ";color:var(--ok);font-weight:700}
.shot .btn{justify-self:start}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 32px));background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgb(0 0 0 / .45)}
.dlg{padding:18px;display:grid;gap:14px;max-height:80vh;overflow:auto}
.dlg-top{position:sticky;top:-18px;z-index:2;margin:-18px -18px 0;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dlg h4{margin:0;font-family:var(--font-display);font-size:1.15rem}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl td.n{font-family:var(--font-num);text-align:right}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.9rem;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card.tap:hover{border-color:var(--accent)}}

</style></head><body>
<header class="bar"><div class="wrap" style="padding-block:0">
  <div class="brand"><h1>清掃シフト帳</h1><span id="who" class="note"></span></div>
  <div class="roles" id="roles" hidden>
    <div class="seg" role="group" aria-label="表示">
      <button id="r-owner" data-act="role" data-v="owner">オーナー</button>
      <button id="r-staff" data-act="role" data-v="staff">スタッフの画面</button>
    </div>
    <select id="staffPick" aria-label="スタッフを選ぶ"></select>
  </div>
  <nav class="tabs" id="tabs" role="tablist" hidden></nav>
</div></header>
<main class="wrap" id="main"><p class="empty">読み込み中…</p></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" hidden></div>
<script>

const FINAL=["【寝室】", "ベッドフレームに埃がない", "照明がつく（ベッドフレーム2箇所）", "ベッドの下にごみやほこりがたまっていない", "シワがなく綺麗にベッドメイクされている", "シーツに髪の毛がついていない", "異臭がない", "押入れの布団が整理されている", "タオルがセットされている", "【キッチン】", "ハンドソープ・食器洗剤の残量（半分以下で補充）", "水垢、油汚れがない", "ゴミが残っていない", "レンジ・冷蔵庫・冷凍庫の中を確認", "スポンジを替える（小さいもの1つ）", "食器棚・家電に埃がない", "床に汚れがない", "コーヒー・お茶などを補充（宿泊人数分十分あるか）", "お菓子・水・ジュースがセットされている", "【洗濯機上】", "アメニティを補充（歯ブラシ／ボディスポンジ／コットン／くし）", "ドライヤー・アイロンのコードが綺麗にされている", "洗濯ジェルボールが十分にある（6〜7個）", "洗濯機のゴミはないか（洗濯カス、内部）", "【トイレ】", "異臭がしない", "芳香剤の残量確認（なくなってから交換）", "トイレットペーパーを三角に折る・補充（棚に置けるだけ）", "便器・便座・床に汚れがない", "汚物入れの確認", "スリッパがきれい（裏面も）", "壁に汚れがない", "【浴室】", "清掃ブラシに髪の毛がついていない", "洗面台がきれい", "壁にカビがない", "シャンプー等の残量確認（半分以下で補充）", "シャワーが正常", "異臭がない", "鏡が汚れていない", "水滴を拭き取っている・水垢がない", "排水溝に髪の毛が残っていない", "【玄関】", "郵便受けにチラシが入っていない", "土間にごみ・埃がない", "玄関マットが汚れていない", "スリッパがそろっている", "スリッパの裏に髪の毛等がついていない", "ドア・鍵が正常", "照明がつく", "芳香剤の残量（なくなってから補充）", "ウエットティッシュの残量確認", "ハンガーが整えられている", "【リビング】", "ソファ・カーペットに髪の毛がついていない", "エアコンが作動する", "カーテン・サッシ・スクリーンが汚れていない", "テーブルが汚れていない", "テーブルセッティング（花瓶／おたくさ／メッセージカード／Wi-Fi）", "ティッシュが補充されている（毎回残量確認）", "椅子のセッティングがされている", "椅子下のBOXが整っている（カメラ／リモコン／けん玉／UNO／トランプ）", "【最終チェック】", "ゴミが残っていない", "忘れ物がない", "電気オフ", "エアコンオフ", "窓・カーテンが閉まっている", "Wi-Fiが正常", "お湯が出る", "掃除機の中にゴミが残っていない"];
const STOCK=["【キッチン】", "水｜ストック無", "オレンジジュース｜4", "グレープジュース｜4", "ジンジャーエール｜4", "コーラ｜4", "三谷サイダー｜4", "お茶｜10", "コーヒー｜10", "おたくさ｜10", "割り箸｜残5本", "ラップ｜ストック無", "アルミホイル｜ストック無", "ゴミ袋（リビング用）｜ストック無", "ゴミ袋 20ℓ｜ストック無", "ゴミ袋 45ℓ｜ストック無", "キッチンペーパー｜ストック無", "スポンジ｜4", "食器洗剤｜ストック無", "アルコールスプレー｜ストック無", "キッチンハイタースプレー｜ストック無", "ハンドソープ｜ストック無", "爪楊枝｜なくなりかけたら", "ティッシュペーパー｜2", "ペーパータオル｜ストック無", "【浴室・洗面】", "ジェルボール｜ストック無", "シャンプー詰め替え｜ストック無", "リンス詰め替え｜ストック無", "ボディソープ詰め替え｜ストック無", "バスマジックリン詰め替え｜ストック無", "【消臭・芳香剤】", "ファブリーズ詰替｜ストック無", "玄関芳香剤｜なくなりかけたら", "【トイレ】", "トイレットペーパー｜3", "流せるトイレシート｜残り3枚", "トイレマジックリン｜なくなりかけたら", "消臭元スプレー｜なくなりかけたら", "トイレハイター｜なくなりかけたら", "芳香剤｜ストック無", "【アメニティ】", "くし｜20", "歯ブラシ｜20", "コットンセット｜20", "ボディスポンジ｜20", "クレンジングオイル｜なくなりかけたら", "化粧水｜なくなりかけたら", "乳液｜なくなりかけたら", "耳栓｜10", "【掃除用品】", "カーペットコロコロ スペア｜1", "フローリングシート｜残り3枚", "フローリングウェットシート｜ストック無", "マイクロファイバークロス｜使えなくなったら", "雑巾｜使えなくなったら", "激落ちシート（キッチン）｜残り5枚", "激落ちシート（緑）｜残り5枚", "アースジェット｜なくなりかけたら"];
const TRT=['破損','汚損','忘れ物','その他'];
const man=()=>S.manualUrl||'';
const manBtn=()=>man()?`<a class="btn ghost small" style="text-decoration:none;justify-self:start" href="${h(man())}" target="_blank" rel="noopener">清掃マニュアルを見る</a>`:'';
const isH=l=>/^【.*】$/.test(l);
const nm=l=>l.split('｜')[0].trim();
const items=L=>L.filter(l=>!isH(l)).map(nm);
function listHtml(L,fn){let i=0;return L.map(l=>isH(l)?`<div class="lh">${h(l.slice(1,-1))}</div>`:fn(nm(l),(l.split('｜')[1]||'').trim(),i++)).join('')}
const fl=p=>p.finalList||FINAL, sl=p=>p.stockList||STOCK;
const TRS=c=>c.troubles||(c.troubles=[]);
const SHOTS=['ベッドメイク・タオル','押入れ（布団）','備品（プロジェクターなど）','アメニティ','冷蔵庫の中','キッチン全体','キッチンのシンク・蛇口','ゴミ箱（キッチン）','お風呂場全体','お風呂場の蛇口','お風呂の排水溝','洗面台・鏡','トイレ全体','リビング全体','ラック','テーブルセッティング','ゴミ箱（リビング）'];
const pl=p=>(p&&p.shotList&&p.shotList.length)?p.shotList:SHOTS;
const SH=c=>c.shots||(c.shots={});
const WD='日月火水木金土';
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const add=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const TODAY=ymd(new Date());
const md=s=>{const d=new Date(s+'T00:00');return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const rel=s=>({0:'今日',1:'明日',[-1]:'昨日'})[diff(TODAY,s)]||'';
const uid=()=>Math.random().toString(36).slice(2,9);
const SRC={airbnb:'Airbnb',booking:'Booking.com',manual:'手入力'};
/* ---------- state & data (Supabase) ---------- */
let sb=null, ME=null, NAMES={};
let S={properties:[],staff:[],pending:[],reservations:[],cleanings:{},extras:[],confirms:{},rate:3000,manualUrl:''};
let ui={role:'owner',staff:null,tab:'clean'};
try{const t=JSON.parse(localStorage.getItem('cs-ui')||'{}');if(t.tab)ui.tab=t.tab}catch(e){}
const saveUi=()=>{try{localStorage.setItem('cs-ui',JSON.stringify({tab:ui.tab}))}catch(e){}};
const nameOf=id=>NAMES[id]||'';

async function loadAll(){
  const r=await Promise.all([
    sb.from('settings').select('*').eq('id',1).maybeSingle(),

function staffView(){
  const me=staff(ui.staff);if(!me)return '<p class="empty">スタッフが登録されていません。</p>';
  const seg=`<div class="seg" role="group" style="margin-top:12px"><button data-act="sv" data-v="list" aria-pressed="${ui.sv!=='cal'}">リスト</button><button data-act="sv" data-v="cal" aria-pressed="${ui.sv==='cal'}">カレンダー</button></div>`;
  if(ui.sv==='cal')return seg+ownerCal();
  const all=cleanings();
  const mineAll=all.filter(x=>x.c.staffId===me.id);
  const mine=mineAll.filter(x=>!x.c.doneAt||flag(x));
  const hist=mineAll.filter(x=>x.c.doneAt&&!flag(x)).reverse();
  const left=mine.filter(x=>x.date.startsWith(TODAY.slice(0,7))).length;
  const open=all.filter(x=>x.status==='open'&&x.date>=TODAY&&me.props.includes(x.r.propertyId));
  const card=(x,btn)=>`<div class="card ${btn?'':'tap'}" ${btn?'':`data-act="detail" data-id="${x.r.id}"`}>${cardHead(x)}${facts(x)}${btn?`<div class="row" style="justify-content:flex-end">${ME.role==='staff'?`<button class="btn small" data-act="take" data-id="${x.r.id}">この清掃に入る</button>`:'<span class="note">プレビュー中は入れません</span>'}</div>`:''}</div>`;
  return seg+`<div class="row" style="margin-top:16px"><p class="note" style="margin:0">${h(me.name)}さんの画面です。ほかのスタッフの担当は表示されません。</p>${manBtn()}</div>
  <div class="sect"><h3>あなたの担当 <small class="note">今月の残り ${left}件</small></h3>${grouped(mine,x=>card(x))||'<p class="empty">これからの担当はありません。下の「募集中」から入れます。</p>'}${hist.length?`<details class="refs hist" style="margin-top:12px"><summary>完了した清掃の履歴（${hist.length}件）</summary>${grouped(hist,x=>card(x))}</details>`:''}</div>
  <div class="sect"><h3>募集中の清掃</h3>${grouped(open,x=>card(x,true))||'<p class="empty">募集中の清掃はありません。</p>'}</div>${staffPay(me)}`;
}

function compress(file){return new Promise(res=>{const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);res(cv.toDataURL('image/jpeg',.7))};
  im.onerror=()=>res(null);im.src=u})}

async function saveCsv(){
  const {m,rows}=monthCalc();
  const blob=new Blob(['﻿'+csvOf(m,rows)],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`cleaning-pay_${m}.csv`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

  $('#who').innerHTML=`${h(ME.name)}さん <button class="btn ghost small" data-act="logout">ログアウト</button>`;
  if(!ME.active){$('#roles').hidden=true;$('#tabs').hidden=true;
    $('#main').innerHTML=`<p class="empty">${ME.removed?'このアカウントは使えなくなっています。オーナーに確認してください。':'登録ありがとうございます。オーナーが承認すると使えるようになります。<br>承認されたら、このページを開き直してください。'}</p>`;return}
  const owner=ME.role==='owner';
  $('#roles').hidden=!owner;
  $('#r-owner').setAttribute('aria-pressed',ui.role==='owner');$('#r-staff').setAttribute('aria-pressed',ui.role==='staff');
  const sp=$('#staffPick');sp.hidden=!owner||ui.role!=='staff';sp.innerHTML=S.staff.map(s=>`<option value="${s.id}" ${s.id===ui.staff?'selected':''}>${h(s.name)}さんの画面</option>`).join('');
  const tabs=[['clean','清掃予定'],['cal','カレンダー'],['res','予約・人数'],['tally','支払い'],['set','設定']];
  $('#tabs').hidden=ui.role!=='owner';
  $('#tabs').innerHTML=tabs.map(([k,l])=>`<button role="tab" aria-selected="${ui.tab===k}" data-act="tab" data-v="${k}">${l}${k==='set'&&S.pending.length?` <span class="pill open">${S.pending.length}</span>`:''}</button>`).join('');
  if(ui.role==='staff'&&!staff(ui.staff)){$('#main').innerHTML='<p class="empty">スタッフがまだ登録されていません。</p>';return}
  $('#main').innerHTML=ui.role==='staff'?staffView():({clean:ownerClean,cal:ownerCal,res:ownerRes,tally:ownerTally,set:ownerSettings}[ui.tab]||ownerClean)();
}
$('#staffPick').onchange=e=>{ui.staff=e.target.value;render()};
const resOf=id=>S.reservations.find(x=>x.id===id);
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT'||el.tagName==='INPUT'||el.tagName==='TEXTAREA')return;
  const {act,id,v}=el.dataset;
  if(act==='lmode')renderLogin(v);
  else if(act==='logout'){await sb.auth.signOut()}
  else if(act==='role'){ui.role=v;if(!staff(ui.staff))ui.staff=S.staff[0]?.id;render()}
  else if(act==='tab'){ui.tab=v;saveUi();render()}
  else if(act==='detail')detail(id);
  else if(act==='close')dlg.close();
  else if(act==='sv'){ui.sv=v;render()}
  else if(act==='cmon'){ui.cOff=(ui.cOff||0)+(+v);render()}
  else if(act==='cday')dayDlg(v);
  else if(act==='savemid'){if(await saveCleaning(id))toast('保存しました。続きはあとからできます')}
  else if(act==='ack'){const c=C(id),k=c.doneAt?'snapD':'snapA',cur=snap(nextOf(resOf(id)));if(ME.role==='owner'){c['o'+k]=cur}else{if(!(('o'+k) in c))c['o'+k]=c[k];c[k]=cur}if(dlg.open)detail(id);render();if(await saveCleaning(id))toast('確認済みにしました')}
  else if(act==='trnew')trDlg(id);
  else if(act==='confirm'){const r=monthCalc().rows.find(x=>x.st.id===ME.id);S.confirms[cfKey(v,ME.id)]={at:TODAY,total:r.total};render();
    if(await q(sb.from('confirms').upsert({month:v,staff_id:ME.id,at:TODAY,total:r.total})))toast('確認しました')}
  else if(act==='csv')saveCsv();
  else if(act==='mon'){ui.mOff=(ui.mOff||0)+(+v);render()}
  else if(act==='addex'){const a=+$('#ex-a').value,d=$('#ex-d').value;if(!d||!a){toast('日付と金額を入れてください');return}
    const {data,error}=await sb.from('extras').insert({date:d,staff_id:$('#ex-s').value,amount:a,note:$('#ex-n').value.trim()}).select().single();
    if(error){toast('保存できませんでした');return}S.extras.push({id:data.id,date:data.date,staffId:data.staff_id,amount:data.amount,note:data.note||''});render();toast('追加清掃を記入しました')}
  else if(act==='delex'){S.extras=S.extras.filter(x=>x.id!==id);render();q(sb.from('extras').delete().eq('id',id))}
  else if(act==='stockdlg')stockDlg(id);
  else if(act==='trsave'){const note=$('#tr-note').value.trim();if(!note&&!trTmp.length){toast('内容か写真を入れてください');return}
    el.disabled=true;el.textContent='送信中…';
    const photos=[];for(const d of trTmp){const u=await upload(d);if(u)photos.push(u)}
    TRS(C(id)).push({id:uid(),type:$('#tr-type').value,note,photos,at:TODAY,by:ME.id,resolved:false});trTmp=[];
    if(await saveCleaning(id)){render();detail(id);toast('オーナーに報告しました')}}
  else if(act==='trdone'){const t=TRS(C(id)).find(t=>t.id===el.dataset.t);if(t)t.resolved=true;render();if(await saveCleaning(id))toast('対応済みにしました')}
  else if(act==='refill'){const P=prop(id);delete P.low[el.dataset.k];render();if(await q(sb.from('stock_low').delete().eq('property_id',id).eq('item',el.dataset.k)))toast('補充済みにしました')}
  else if(act==='take'){const c=C(id);c.staffId=ME.id;c.snapA=c.osnapA=snap(nextOf(resOf(id)));render();
    if(await saveCleaning(id,'ほかの人が先に担当になったか、通信できませんでした'))toast('担当になりました')}
  else if(act==='release'){C(id).staffId='';dlg.close();render();if(await saveCleaning(id))toast('担当を外れました')}
  else if(act==='done'){const c=C(id);const P=prop(resOf(id).propertyId);const miss=pl(P).filter(k=>!SH(c)[k]);if(miss.length){toast(`まだ撮っていない場所：${miss.slice(0,3).join('、')}${miss.length>3?` ほか${miss.length-3}か所`:''}`);return}
    const fm=items(fl(P)).filter(k=>!(c.final||{})[k]);if(fm.length){toast(`最終チェックが残っています：${fm.slice(0,3).join('、')}${fm.length>3?` ほか${fm.length-3}件`:''}`);return}
    c.doneAt=TODAY;c.snapD=c.osnapD=snap(nextOf(resOf(id)));dlg.close();render();if(await saveCleaning(id))toast('完了を報告しました')}
  else if(act==='undone'){C(id).doneAt=null;dlg.close();render();saveCleaning(id)}
  else if(act==='syncnow')syncNow(true);
  else if(act==='addres')addResDlg();
  else if(act==='saveres'){const ci=$('#nr-in').value;if(!ci)return;
    const r={id:'manual:'+crypto.randomUUID(),propertyId:$('#nr-p').value,source:'manual',checkin:ci,checkout:add(ci,Math.max(1,+$('#nr-n').value||1)),guests:+$('#nr-g').value||null,towelAdd:0};
    S.reservations.push(r);dlg.close();render();
    q(sb.from('reservations').insert({id:r.id,property_id:r.propertyId,source:'manual',checkin:r.checkin,checkout:r.checkout,guests:r.guests}))}
  else if(act==='delres'){S.reservations=S.reservations.filter(r=>r.id!==id);render();q(sb.from('reservations').delete().eq('id',id))}
  else if(act==='addprop'){const {data,error}=await sb.from('properties').insert({name:'新しい物件'}).select().single();
    if(error){toast('追加できませんでした');return}await sb.from('property_secrets').insert({property_id:data.id});await loadAll();render()}
  else if(act==='delprop'){if(!el.dataset.sure){el.dataset.sure=1;el.textContent='もう一度押すと予約・清掃記録も消えます';return}
    S.properties=S.properties.filter(p=>p.id!==id);render();q(sb.from('properties').delete().eq('id',id))}
  else if(act==='approve'){if(await q(sb.from('profiles').update({active:true,removed:false,props:S.properties.map(p=>p.id)}).eq('id',id))){await loadAll();render();toast('承認しました')}}
  else if(act==='reject'){if(await q(sb.from('profiles').update({active:false,removed:true}).eq('id',id))){await loadAll();render()}}
  else if(act==='delstaff'){if(!el.dataset.sure){el.dataset.sure=1;el.textContent='もう一度押すと外れます';return}
    await q(sb.from('cleanings').update({staff_id:null}).eq('staff_id',id).is('done_at',null));
    if(await q(sb.from('profiles').update({active:false,removed:true}).eq('id',id))){await loadAll();render();toast('スタッフから外しました')}}
  else if(act==='copyurl'){navigator.clipboard?.writeText(location.origin).then(()=>toast('コピーしました'),()=>toast('コピーできませんでした'))}
});
document.addEventListener('change',async e=>{
  const el=e.target;const {act,id}=el.dataset;
  if(act==='assign'){const c=C(id);c.staffId=el.value;c.snapA=c.osnapA=snap(nextOf(resOf(id)));render();if(await saveCleaning(id))toast(el.value?`${staff(el.value).name}さんに割り当てました`:'未担当に戻しました')}
  else if(act==='guests'){const r=resOf(id);r.guests=+el.value||null;q(sb.from('reservations').update({guests:r.guests}).eq('id',id))}
  else if(act==='towel'){const r=resOf(id);r.towelAdd=Math.max(0,+el.value||0);q(sb.from('reservations').update({towel_add:r.towelAdd}).eq('id',id))}
  else if(act==='pname'){const P=prop(id);P.name=el.value.trim()||'物件';q(sb.from('properties').update({name:P.name}).eq('id',id))}
  else if(act==='ical'){const P=prop(id),src=el.dataset.src;P[src]=el.value.trim();
    if(await q(sb.from('property_secrets').upsert({property_id:id,[src+'_ical']:P[src]||null})))toast('保存しました。「今すぐ予約を取り込む」で読み込めます')}
  else if(act==='sname'){const s=staff(id);s.name=el.value.trim()||'スタッフ';NAMES[id]=s.name;q(sb.from('profiles').update({name:s.name}).eq('id',id))}
  else if(act==='sprop'){const s=staff(id);s.props=el.checked?[...new Set([...s.props,el.dataset.p])]:s.props.filter(p=>p!==el.dataset.p);q(sb.from('profiles').update({props:s.props}).eq('id',id))}
  else if(act==='final'){const c=C(id);(c.final||(c.final={}))[el.dataset.k]=el.checked;updProg(id);saveCleaning(id)}
  else if(act==='stock'){const P=prop(id),k=el.dataset.k;P.low=P.low||{};
    if(el.checked){P.low[k]={by:ME.id,at:TODAY};stockDlg(el.dataset.c);if(await q(sb.from('stock_low').upsert({property_id:id,item:k,by:ME.id,at:TODAY})))toast('オーナーに通知しました')}
    else{delete P.low[k];stockDlg(el.dataset.c);q(sb.from('stock_low').delete().eq('property_id',id).eq('item',k))}}
  else if(act==='trph'){for(const f of el.files){const d=await compress(f);if(d)trTmp.push(d)}$('#tr-th').innerHTML=trTmp.map(p=>`<img src="${p}" alt="">`).join('')}
  else if(act==='rate'){S.rate=Math.max(0,+el.value||0);q(sb.from('settings').update({rate:S.rate}).eq('id',1))}
  else if(act==='manual'){S.manualUrl=el.value.trim();q(sb.from('settings').update({manual_url:S.manualUrl}).eq('id',1))}
  else if(act==='flist'||act==='slist'||act==='shlist'){const P=prop(id);const v=el.value.split('\n').map(t=>t.trim()).filter(Boolean);
    const [key,col]={flist:['finalList','final_list'],slist:['stockList','stock_list'],shlist:['shotList','shot_list']}[act];
    P[key]=v;await q(sb.from('properties').update({[col]:v}).eq('id',id));if(act==='shlist'){ui.openRefs=id;render()}}
  else if(act==='ref'){const f=el.files[0];if(!f)return;toast('アップロード中…');const d=await compress(f);const u=d&&await upload(d);
    if(u){const p=prop(id);(p.refs||(p.refs={}))[el.dataset.k]=u;ui.openRefs=id;render();if(await q(sb.from('properties').update({refs:p.refs}).eq('id',id)))toast('見本を登録しました')}}
  else if(act==='photo'){const f=el.files[0];if(!f)return;toast('アップロード中…');const d=await compress(f);const u=d&&await upload(d);
    if(u){SH(C(id))[el.dataset.k]=u;detail(id);if(await saveCleaning(id))toast('保存しました')}}
});
boot();

</script>
</body></html>
