<style>
/* Layout: one narrow column like a ledger book; month bar sticky; totals first, then income lines, then expense lines. Same palette as 清掃シフト帳 */
:root{
  --bg:#F2F4F1;--surface:#FFFFFF;--ink:#1D2724;--muted:#5F6B67;--line:#DCE2DE;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#5FB8AB;--accent-ink:#0E1A17;--accent-soft:#1F3531;
  --air:#E57A8B;--bkg:#7FA3E0;--warn:#E0A456;--warn-soft:#3A2E1C;--ok:#6CC08E;--ok-soft:#1E3326;--danger:#F08A80;--danger-soft:#3D1F1D;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A18;--surface:#1C2421;--ink:#E6ECE9;--muted:#9AA7A2;--line:#2C3733;
  --accent:#5FB8AB;--accent-ink:#0E1A17;--accent-soft:#1F3531;
  --air:#E57A8B;--bkg:#7FA3E0;--warn:#E0A456;--warn-soft:#3A2E1C;--ok:#6CC08E;--ok-soft:#1E3326;--danger:#F08A80;--danger-soft:#3D1F1D;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

button{font:inherit;cursor:pointer}

button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=number],input[type=text],input[type=email],input[type=password],input[type=month]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;box-sizing:border-box}

details summary{cursor:pointer;color:var(--muted);font-size:.85rem;padding:6px 2px}
.foot{margin-top:28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}

.ytable table{border-collapse:separate;border-spacing:0;font-size:.85rem;min-width:100%}
.ytable th,.ytable td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}

.ytable tbody th{text-align:left;font-weight:500;position:sticky;left:0;background:var(--surface);z-index:1}
.ytable thead th{background:var(--accent-soft);color:var(--accent);font-weight:700;position:sticky;top:0}
.ytable thead th:first-child{left:0;z-index:2}
.ytable tr.total th,.ytable tr.total td{font-weight:700;background:var(--accent-soft)}
.ytable tr.profit th,.ytable tr.profit td{font-weight:700;background:var(--warn-soft)}
.ytable td.sum{border-left:1px solid var(--line);font-weight:700}
.ytable td.neg{color:var(--danger)}
.mlink{border:0;background:none;color:inherit;font:inherit;font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:460px){.totals{grid-template-columns:1fr 1fr}.tot.profit{grid-column:1/-1}}
</style>

<div class="wrap">
 <header class="bar">
  <h1>MINATO 収支表</h1>
  <div class="seg" id="views" role="group" aria-label="表示" hidden><button data-view="month">月の明細</button><button data-view="year">年間一覧</button></div>
  <div class="mon" id="mon" hidden>
   <button class="icon" id="prev" aria-label="前の月">‹</button><b id="mlabel"></b><button class="icon" id="next" aria-label="次の月">›</button>
  </div>
 </header>
 <main id="main"><p class="empty">読み込み中…</p></main>
</div>
<div id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const diff=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const WD='日月火水木金土';
const md=s=>{const d=new Date(s+'T00:00');return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const yen=n=>(n<0?'-¥':'¥')+Math.abs(Math.round(n)).toLocaleString('ja-JP');
const TODAY=ymd(new Date());
const SRC={airbnb:'Airbnb',booking:'Booking.com'};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3000)}

const SUPABASE_URL='https://afxbacplkhnovsygiune.supabase.co';
const SUPABASE_KEY='sb_publishable_VH73iuL727rYtlWkE3zu3w_qZvXn-pY'; // 公開用キー（ブラウザに置いてよいもの）
let sb=null,ME=null;
let D={res:[],amounts:[],months:{},extras:[],rate:3000,rent:45500,rentStart:'2027-02',lastSync:null};
let month=TODAY.slice(0,7),view='month',fy=+TODAY.slice(5,7)>=4?+TODAY.slice(0,4):+TODAY.slice(0,4)-1;
try{if(localStorage.getItem('shushi-view')==='year')view='year'}catch(e){}

async function loadAll(){
  const r=await Promise.all([
    sb.from('settings').select('*').eq('id',1).maybeSingle(),
    sb.from('reservations').select('id,source,checkin,checkout,cancelled'),
    sb.from('booking_amounts').select('*'),
    sb.from('finance_months').select('*'),
    sb.from('extras').select('date,amount,staff_id'),
    sb.from('cleanings').select('reservation_id,staff_id'),
    sb.from('profiles').select('id,name,role,active'),
    sb.from('stay_events').select('kind,checkin,checkout,day,stars')]);
  const bad=r.find(x=>x.error);if(bad){console.error(bad.error);toast('データを読み込めませんでした。通信を確認してください');return false}
  const [st,rs,am,fm,ex,cl,pf,evs]=r.map(x=>x.data);
  D.events=evs||[];
  D.staff=(pf||[]).filter(p=>p.role==='staff'&&p.active);
  D.paid=st?.paid_staff||[];
  D.cleaner=Object.fromEntries((cl||[]).filter(c=>c.staff_id).map(c=>[c.reservation_id,c.staff_id]));
  D.rate=st?.rate??3000;D.rent=st?.rent??45500;D.rentStart=st?.rent_start||'2027-02';D.lastSync=st?.last_sync||null;
  D.wifi=st?.wifi??4200;D.wifiStart=st?.wifi_start??'2026-08';D.initial=st?.initial_cost??null;
  D.res=rs||[];D.amounts=am||[];D.extras=ex||[];
  D.months=Object.fromEntries((fm||[]).map(m=>[m.month,m]));
  return true;
}

/* 本当に泊まったかの確認。キャンセルのメールが届かない予約があるため、予約確定メールだけでは売上に入れない。
   泊まり終えた予約：到着リマインダー・レビュー依頼・口コミのどれかがある
   これからの予約：予約カレンダー（iCal）に載っている */
function stayCheck(it,inCal){
  const ev=D.events||[];
  const rem=ev.some(e=>e.kind==='reminder'&&e.checkin===it.checkin);
  const out=ev.some(e=>e.kind==='checkout'&&e.day>=it.checkout&&e.day<=add(it.checkout,2));
  const rev=ev.some(e=>e.kind==='review'&&e.checkin===it.checkin);
  const proof=[rem&&'到着リマインダー',out&&'レビュー依頼',rev&&'口コミ',inCal&&'予約カレンダー'].filter(Boolean);
  if(it.checkout<=TODAY)return {ok:rem||out||rev||inCal,proof};
  if(it.checkin<=TODAY)return {ok:rem||inCal,proof};
  return {ok:inCal||rem||it.checkin<calFrom(),proof}; // カレンダーの記録が始まる前の日付はカレンダーで確かめられない
}
const calFrom=()=>D.res.filter(r=>r.source==='airbnb').reduce((m,r)=>r.checkin<m?r.checkin:m,'9999-12-31');
const add=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
// 口コミ（Airbnb）。同じ滞在に「レビューが届きました」と「5つ星」の2通が来るので、滞在ごとにまとめる
function reviewOf(it){
  const rs=(D.events||[]).filter(e=>e.kind==='review'&&e.checkin===it.checkin);
  if(!rs.length)return null;
  return {stars:rs.reduce((m,e)=>Math.max(m,e.stars||0),0)||null};
}

/* 予約と金額を突き合わせて、売上・キャンセルの行を作る */
function buildItems(){
  const amts=D.amounts.filter(a=>a.source==='airbnb'&&a.checkin);
  const manual=Object.fromEntries(D.amounts.filter(a=>a.source==='booking_manual').map(a=>[a.code,a.payout]));
  const key=(a,b)=>a+'|'+b;
  const resAir={};D.res.filter(r=>r.source==='airbnb').forEach(r=>{resAir[key(r.checkin,r.checkout)]=r});
  const used=new Set(),items=[];
  // Airbnb：メールの金額（ホスティング収入）を正とする
  amts.sort((a,b)=>(a.mail_at||'')<(b.mail_at||'')?1:-1).forEach(a=>{
    // 延泊・短縮があれば変更後の日付を使い、金額は1泊あたりの受取額×変更後の泊数（メールに金額がないため）
    const alt=a.alt_checkin&&a.alt_checkout&&(a.alt_checkin!==a.checkin||a.alt_checkout!==a.checkout);
    const ci=alt?a.alt_checkin:a.checkin,co=alt?a.alt_checkout:a.checkout;
    const k=key(ci,co);const r=resAir[k];
    if(items.some(i=>i.k===k))return; // 同じ日程は最新のメールだけ使う
    if(r)used.add(r.id);
    if(a.excluded){items.push({k,excluded:true});return} // 売上に数えない予約（予約ごとに設定）
    const id='adj:'+a.code,m=manual[id];
    const amount=m??(alt?Math.round(a.payout/diff(a.checkin,a.checkout)*diff(ci,co)):a.payout);
    const it={src:'airbnb',id,k,checkin:ci,checkout:co,amount,kind:m!=null?'manual':alt?'changed':'auto',guest:a.guest||'',
      orig:alt?{checkin:a.checkin,checkout:a.checkout,payout:a.payout}:null,code:a.code,cancelled:a.cancelled||!!r?.cancelled};
    if(!it.cancelled){const v=stayCheck(it,!!r);it.proof=v.proof;it.unverified=a.verified===true?false:a.verified===false?true:!v.ok;it.forced=a.verified!=null}
    items.push(it);
  });
  // 1泊あたりの平均（Airbnbの実績から）
  const ok=items.filter(i=>!i.cancelled&&!i.unverified&&i.amount);
  const nights=ok.reduce((s,i)=>s+diff(i.checkin,i.checkout),0);
  const avg=nights?ok.reduce((s,i)=>s+i.amount,0)/nights:0;
  D.avg=avg;
  D.res.filter(r=>r.source==='airbnb'&&!used.has(r.id)).forEach(r=>{
    items.push({src:'airbnb',checkin:r.checkin,checkout:r.checkout,amount:Math.round(avg*diff(r.checkin,r.checkout)),kind:'wait',cancelled:r.cancelled});
  });
  const airNights=items.filter(i=>i.src==='airbnb'&&!i.cancelled&&!i.unverified);
  const overlaps=(a,b,c,d)=>a<d&&c<b;
  // Booking.comのカレンダーには「受付期間外」の長いブロック（例：2028年4月の30泊）も入るので、28泊以上は予約として扱わない
  D.res.filter(r=>r.source==='booking'&&diff(r.checkin,r.checkout)<28).forEach(r=>{
    if(!r.cancelled&&airNights.some(i=>overlaps(r.checkin,r.checkout,i.checkin,i.checkout)))return; // Airbnb予約のブロック表示は除く
    const id='booking:'+r.id;const m=manual[id];
    items.push({src:'booking',id,checkin:r.checkin,checkout:r.checkout,amount:m??Math.round(avg*diff(r.checkin,r.checkout)),kind:m!=null?'manual':'est',cancelled:r.cancelled});
  });
  return items.filter(i=>!i.excluded);
}

function calc(m,items=buildItems()){
  const inMonth=items.filter(i=>i.checkin.startsWith(m)).sort((a,b)=>a.checkin<b.checkin?-1:1);
  const live=inMonth.filter(i=>!i.cancelled&&!i.unverified),cxl=inMonth.filter(i=>i.cancelled),unv=inMonth.filter(i=>!i.cancelled&&i.unverified);
  live.forEach(i=>{if(i.src==='airbnb')i.review=reviewOf(i)});
  const reviews=live.filter(i=>i.review).length,five=live.filter(i=>i.review?.stars===5).length;
  const sum=l=>l.reduce((s,i)=>s+(i.amount||0),0);
  const income=sum(live),air=sum(live.filter(i=>i.src==='airbnb')),bk=income-air;
  // 宿泊日数はその月に泊まった夜の数（月をまたぐ予約は月ごとに分ける）
  const first=m+'-01',d=new Date(first+'T00:00');d.setMonth(d.getMonth()+1);const next=ymd(d);
  const days=diff(first,next);
  const nights=items.filter(i=>!i.cancelled&&!i.unverified).reduce((s,i)=>{const a=i.checkin>first?i.checkin:first,b=i.checkout<next?i.checkout:next;return s+Math.max(0,diff(a,b))},0);
  // 清掃費は「清掃費に入れるスタッフ」が担当した清掃だけ（チェックアウト日の月）
  const paid=new Set(D.paid||[]);
  const outs=(D.res||[]).filter(r=>!r.cancelled&&r.checkout.startsWith(m));
  const cleanN=outs.filter(r=>paid.has(D.cleaner?.[r.id])).length;
  const unassigned=outs.filter(r=>!D.cleaner?.[r.id]).length;
  const extra=D.extras.filter(e=>e.date.startsWith(m)&&paid.has(e.staff_id)).reduce((s,e)=>s+e.amount,0);
  const fm=D.months[m]||{};
  const rent=m>=D.rentStart?D.rent:0;
  const wifi=D.wifiStart&&m>=D.wifiStart?D.wifi:0;
  const util=['electricity','gas','water','other'].reduce((s,k)=>s+(fm[k]||0),0);
  const cleaningAuto=cleanN*D.rate+extra;
  const cleaning=fm.cleaning_override??cleaningAuto; // 手入力があればそちらを使う
  return {live,cxl,unv,reviews,five,income,air,bk,nights,days,cleanN,unassigned,extra,cleaningAuto,cleaning,rent,wifi,fm,util,expense:rent+wifi+cleaning+util};
}

const TAG={auto:['auto','自動'],wait:['est','見込み・メール待ち'],est:['est','見込み'],manual:['man','手入力'],changed:['est','日程変更・見込み']};
function incomeLine(i){
  const n=diff(i.checkin,i.checkout),t=TAG[i.kind];
  const edit=`<label class="inp note">実際の金額<input type="number" min="0" step="1" inputmode="numeric" id="bk-${h(i.id)}" data-bk="${h(i.id)}" value="${i.kind==='manual'?i.amount:''}" placeholder="${i.amount}"></label>`;
  const o=i.orig||null;
  const why=i.src==='booking'?'Booking.comのメールには金額が書かれていないため、Airbnbの1泊平均で計算しています。'
    :o?`日程が変わりました（元は${md(o.checkin)}〜${md(o.checkout)}・${diff(o.checkin,o.checkout)}泊で${yen(o.payout)}）。変更のメールには金額がないため、1泊あたりの受取額で計算しています。`
    :i.kind==='manual'?'金額を手入力しています。空にすると自動に戻ります。':'';
  return `<div class="line${i.cancelled?' cxl':''}">
   <div class="what"><span class="chip ${i.src}">${SRC[i.src]}</span><span class="dates">${md(i.checkin)}〜${md(i.checkout)}</span><span class="note">${n}泊</span>
    ${i.cancelled?'<span class="tag cxl">キャンセル</span>':i.unverified?'<span class="tag cxl">宿泊の確認なし</span>':`<span class="tag ${t[0]}">${t[1]}</span>`}
    ${i.review?`<span class="tag rev">口コミ</span>${i.review.stars?`<span class="tag star">${'★'.repeat(i.review.stars)}${i.review.stars}</span>`:'<span class="tag rev">星はまだ非公開</span>'}`:''}</div>
   <div class="amt">${yen(i.amount||0)}</div>
   ${i.unverified?`<div class="sub">予約確定のメールはありますが、到着リマインダー・レビュー依頼・口コミ・予約カレンダーのどれにも記録がないため、売上に入れていません（キャンセルのメールが届かなかった予約の可能性があります）。確認コード ${h(i.code)}${i.guest?`・${h(i.guest)}さん`:''}<button class="btn ghost small" data-verify="${h(i.code)}" data-v="1">泊まったので売上に入れる</button></div>`
    :!i.cancelled&&i.forced&&i.src==='airbnb'?`<div class="sub">手動で「泊まった」にしています。<button class="btn ghost small" data-verify="${h(i.code)}" data-v="">元に戻す</button></div>`
    :!i.cancelled&&why&&i.id?`<div class="sub">${why}${edit}</div>`:''}
  </div>`;
}
function utilLine(k,label){
  const v=calc(month).fm[k];
  return `<div class="line"><div class="what">${label}</div>
   <label class="inp"><span class="note">¥</span><input type="number" min="0" step="1" inputmode="numeric" id="u-${k}" data-util="${k}" value="${v??''}" placeholder="未入力" aria-label="${label}"></label></div>`;
}

/* 年度（4月〜翌3月）の一覧。スプレッドシート「収支管理（自分用）」と同じ並び */
const fyOf=m=>{const [y,mo]=m.split('-').map(Number);return mo>=4?y:y-1};
function renderYear(){
  $('#mlabel').textContent=`${fy}年度`;
  const items=buildItems();
  const ms=Array.from({length:12},(_,i)=>{const d=new Date(fy,3+i,1);return ymd(d).slice(0,7)});
  const cs=ms.map(m=>calc(m,items));
  let cum=0;cs.forEach(c=>{c.profit=c.income-c.expense;cum+=c.profit;c.cum=cum});
  const tot=k=>cs.reduce((s,c)=>s+(c[k]||0),0);
  const fmk=k=>c=>c.fm[k]??null;
  const Y=v=>v==null?'':yen(v),P=v=>v==null||!isFinite(v)?'':(v*100).toFixed(1)+'%';
  const T=(fn,mode='sum')=>mode==='none'?'':mode==='sum'?cs.reduce((s,c)=>s+(fn(c)||0),0):'';
  const rows=[
   ['Booking売上',c=>c.bk,Y],['Airbnb売上',c=>c.air,Y],['売上合計',c=>c.income,Y,'sum','total'],
   ['宿泊日数',c=>c.nights,v=>v],['日数',c=>c.days,v=>v],
   ['稼働率',c=>c.nights/c.days,P,'rate','total'],
   ['家賃',c=>c.rent,Y],['水道代',fmk('water'),Y],['ガス代',fmk('gas'),Y],['電気代',fmk('electricity'),Y],
   ['Wi-Fi',c=>c.wifi,Y],['清掃代',c=>c.cleaning,Y],['その他',fmk('other'),Y],
   ['経費合計',c=>c.expense,Y,'sum','total'],
   ['利益',c=>c.profit,Y,'sum','profit'],['累計利益',c=>c.cum,Y,'none'],
   ['回収率',c=>D.initial?c.cum/D.initial:null,P,'recover'],
   ['口コミ数',c=>c.reviews,v=>v+'件'],['★5獲得数',c=>c.five,v=>v+'件'],
  ];
  const totalCell=([,fn,f,mode='sum'])=>{
    if(mode==='rate')return P(tot('nights')/tot('days'));
    if(mode==='recover')return D.initial?P(cum/D.initial):'';
    return mode==='none'?'':f(T(fn))};
  const neg=v=>typeof v==='number'&&v<0;
  $('#main').innerHTML=`
  <div class="totals">
   <div class="tot"><span>年度の売上</span><b>${yen(tot('income'))}</b></div>
   <div class="tot"><span>年度の経費</span><b>${yen(tot('expense'))}</b></div>
   <div class="tot profit"><span>年度の利益</span><b class="${cum<0?'neg':''}">${yen(cum)}</b></div>
  </div>
  <p class="note revsum" style="margin:0">口コミ <b>${tot('reviews')}</b>件・★5 <b>${tot('five')}</b>件（年度）</p>
  <div class="ytable"><table>
   <thead><tr><th scope="col">項目</th>${ms.map(m=>`<th scope="col"><button class="mlink" data-m="${m}">${+m.slice(5)}月</button></th>`).join('')}<th scope="col">合計</th></tr></thead>
   <tbody>${rows.map(r=>{const [label,fn,f,,cls='']=r;
     return `<tr class="${cls}"><th scope="row">${label}</th>${cs.map(c=>{const v=fn(c);return `<td class="${neg(v)?'neg':''}">${f(v)}</td>`}).join('')}<td class="sum">${totalCell(r)}</td></tr>`}).join('')}</tbody>
  </table></div>
  <p class="note">回収率は、累計利益が初期費用${D.initial?yen(D.initial):'（未入力）'}の何％まで戻ったかです。月の名前を押すと、その月の明細が開きます。Airbnbの売上は手数料を引いた受取額です。「見込み」の金額も合計に入っています。</p>
  ${footHtml()}`;
}

const paidNames=()=>(D.staff||[]).filter(s=>(D.paid||[]).includes(s.id)).map(s=>h(s.name)+'さん').join('・')||'スタッフ';
function footHtml(){
  return `<div class="foot">
   <button class="btn ghost small" id="sync">今すぐ予約を取り込む</button>
   <span class="note">予約の最終取り込み：${D.lastSync?new Date(D.lastSync).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}・Airbnb 1泊平均 ${yen(D.avg||0)}</span>
  </div>
  <details class="sect"><summary>家賃・Wi-Fi・初期費用の設定</summary>
   <div class="card">
    <label>家賃（月額）<input type="number" min="0" id="s-rent" value="${D.rent}" style="width:9em"></label>
    <label>家賃が発生する月<input type="month" id="s-start" value="${D.rentStart}"></label>
    <label>Wi-Fi（月額）<input type="number" min="0" id="s-wifi" value="${D.wifi}" style="width:9em"></label>
    <label>Wi-Fiが発生する月<input type="month" id="s-wstart" value="${D.wifiStart||''}"></label>
    <label>初期費用（回収率の計算に使います）<input type="number" min="0" id="s-init" value="${D.initial??''}" placeholder="未入力" style="width:10em"></label>
    <fieldset style="border:0;padding:0;margin:0;display:grid;gap:4px"><legend style="padding:0;margin-bottom:4px">清掃費に入れるスタッフ</legend>
     ${(D.staff||[]).map(s=>`<label><input type="checkbox" id="pay-${s.id}" data-pay="${s.id}" ${(D.paid||[]).includes(s.id)?'checked':''}> ${h(s.name)}</label>`).join('')}
    </fieldset>
   </div>
  </details>`;
}

function render(){
  $('#mon').hidden=false;$('#views').hidden=false;
  document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));
  if(view==='year')return renderYear();
  const [y,mo]=month.split('-').map(Number);
  $('#mlabel').textContent=`${y}年${mo}月`;
  const c=calc(month);
  const profit=c.income-c.expense;
  const rs=D.rentStart.split('-').map(Number);
  $('#main').innerHTML=`
  <div class="totals">
   <div class="tot"><span>売上</span><b>${yen(c.income)}</b></div>
   <div class="tot"><span>支出</span><b>${yen(c.expense)}</b></div>
   <div class="tot profit"><span>収支</span><b class="${profit<0?'neg':''}">${yen(profit)}</b></div>
  </div>
  <p class="note revsum" style="margin:0">口コミ <b>${c.reviews}</b>件・★5 <b>${c.five}</b>件（この月にチェックインした予約）</p>
  <p class="note" style="margin:0">売上はチェックイン日の月で数えています。${c.live.some(i=>i.kind!=='auto'&&i.kind!=='manual')?'「見込み」を含みます。':''}</p>

  <section class="sect"><h2><span>売上（${c.live.length}件）</span><span class="num">${yen(c.income)}</span></h2>
   <div class="ledger">${c.live.map(incomeLine).join('')||'<p class="empty">この月にチェックインする予約はありません。</p>'}</div>
   ${c.unv.length?`<details open><summary>宿泊の確認がとれない予約 ${c.unv.length}件（合計に入れていません）</summary><div class="ledger">${c.unv.map(incomeLine).join('')}</div></details>`:''}
   ${c.cxl.length?`<details><summary>キャンセル ${c.cxl.length}件（合計に入れていません）</summary><div class="ledger">${c.cxl.map(incomeLine).join('')}</div></details>`:''}
  </section>

  <section class="sect"><h2><span>支出</span><span class="num">${yen(c.expense)}</span></h2>
   <div class="ledger">
    <div class="line"><div class="what">家賃${c.rent?'':`<span class="note">${rs[0]}年${rs[1]}月から発生</span>`}</div><div class="amt">${yen(c.rent)}</div></div>
    <div class="line"><div class="what">Wi-Fi</div><div class="amt">${yen(c.wifi)}</div></div>
    <div class="line"><div class="what">清掃費${c.fm.cleaning_override!=null?'<span class="tag man">手入力</span>':`<span class="note">${paidNames()}の担当 ${c.cleanN}回 × ${yen(D.rate)}${c.extra?` ＋ 追加作業 ${yen(c.extra)}`:''}</span>`}</div>
     <label class="inp"><span class="note">¥</span><input type="number" min="0" step="1" inputmode="numeric" id="u-cleaning_override" data-util="cleaning_override" value="${c.fm.cleaning_override??''}" placeholder="${c.cleaningAuto}" aria-label="清掃費"></label>
     <div class="sub">${c.fm.cleaning_override!=null?`自動計算では${yen(c.cleaningAuto)}です。欄を空にすると自動計算に戻ります。`:`自動で計算しています。違うときは金額を入れてください。${c.unassigned?`担当がまだ決まっていない清掃が${c.unassigned}回あります。`:''}`}</div></div>
    ${utilLine('electricity','電気')}${utilLine('gas','ガス')}${utilLine('water','水道')}${utilLine('other','その他')}
   </div>
   <p class="note">電気・ガス・水道は入力すると自動で保存されます。清掃費は清掃シフト帳の担当者・単価・追加作業から計算しています。</p>
  </section>
  ${footHtml()}`;
}

async function saveUtil(k,el){
  const v=el.value===''?null:Math.max(0,Math.round(+el.value));
  const row={...(D.months[month]||{month}),[k]:v,updated_at:new Date().toISOString()};
  D.months[month]=row;render();
  const {error}=await sb.from('finance_months').upsert(row);
  toast(error?'保存できませんでした。通信を確認してください':'保存しました');
}
async function saveBooking(id,el){
  if(el.value===''){
    D.amounts=D.amounts.filter(a=>a.code!==id);render();
    const {error}=await sb.from('booking_amounts').delete().eq('code',id);toast(error?'保存できませんでした':'見込みに戻しました');return}
  const row={code:id,source:'booking_manual',payout:Math.max(0,Math.round(+el.value)),updated_at:new Date().toISOString()};
  D.amounts=[...D.amounts.filter(a=>a.code!==id),row];render();
  const {error}=await sb.from('booking_amounts').upsert(row);toast(error?'保存できませんでした':'保存しました');
}
async function saveSetting(patch){
  const map={rent:'rent',rent_start:'rentStart',wifi:'wifi',wifi_start:'wifiStart',initial_cost:'initial',paid_staff:'paid'};
  Object.entries(patch).forEach(([k,v])=>D[map[k]]=v);render();
  const {error}=await sb.from('settings').update(patch).eq('id',1);toast(error?'保存できませんでした':'保存しました');
}
async function syncNow(){
  toast('予約を取り込んでいます…');
  const {error}=await sb.rpc('sync_now');if(error){toast('取り込めませんでした');return}
  for(let i=0;i<6;i++){await new Promise(r=>setTimeout(r,2500));const {data,error:e}=await sb.rpc('sync_collect');if(e||!data.pending)break}
  await loadAll();render();toast('予約を取り込みました');
}

document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.util)saveUtil(el.dataset.util,el);
  else if(el.dataset.bk)saveBooking(el.dataset.bk,el);
  else if(el.id==='s-rent')saveSetting({rent:Math.max(0,Math.round(+el.value||0))});
  else if(el.id==='s-start'&&el.value)saveSetting({rent_start:el.value});
  else if(el.id==='s-wifi')saveSetting({wifi:Math.max(0,Math.round(+el.value||0))});
  else if(el.id==='s-wstart')saveSetting({wifi_start:el.value||null});
  else if(el.dataset.pay){const id=el.dataset.pay;const s=new Set(D.paid||[]);el.checked?s.add(id):s.delete(id);saveSetting({paid_staff:[...s]})}
  else if(el.id==='s-init')saveSetting({initial_cost:el.value===''?null:Math.max(0,Math.round(+el.value))});
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.id,step=id==='next'?1:-1;
  if(id==='prev'||id==='next'){
    if(view==='year')fy+=step;
    else{const d=new Date(month+'-01T00:00');d.setMonth(d.getMonth()+step);month=ymd(d).slice(0,7)}
    render()}
  else if(b.dataset.view){view=b.dataset.view;if(view==='year')fy=fyOf(month);try{localStorage.setItem('shushi-view',view)}catch(e){}render()}
  else if(b.dataset.m){month=b.dataset.m;view='month';render()}
  else if(b.dataset.verify){const code=b.dataset.verify,v=b.dataset.v?true:null;const a=D.amounts.find(x=>x.code===code);if(a)a.verified=v;render();
    sb.from('booking_amounts').update({verified:v}).eq('code',code).then(({error})=>toast(error?'保存できませんでした':v?'売上に入れました':'元に戻しました'))}
  else if(id==='sync')syncNow();
});

function renderLogin(){
  $('#mon').hidden=true;
  $('#main').innerHTML=`<form id="authf" class="card" style="margin-top:24px;max-width:420px">
   <p class="note" style="margin:0">清掃シフト帳と同じオーナーのアカウントでログインしてください。</p>
   <label>メールアドレス<input type="email" id="au-mail" required autocomplete="email" style="width:100%"></label>
   <label>パスワード<input type="password" id="au-pass" required autocomplete="current-password" style="width:100%"></label>
   <button class="btn" type="submit">ログイン</button></form>`;
  $('#authf').onsubmit=async e=>{e.preventDefault();
    const {error}=await sb.auth.signInWithPassword({email:$('#au-mail').value.trim(),password:$('#au-pass').value});
    if(error)toast('メールアドレスかパスワードが違います')};
}
let startedFor=null;
async function start(session){
  if(!session){startedFor=null;renderLogin();return}
  if(startedFor===session.user.id)return;startedFor=session.user.id;
  $('#main').innerHTML='<p class="empty">読み込み中…</p>';
  const {data:p}=await sb.from('profiles').select('role,active').eq('id',session.user.id).maybeSingle();
  if(p?.role!=='owner'||!p.active){$('#main').innerHTML='<p class="empty">収支表はオーナーだけが見られます。</p>';return}
  if(await loadAll())render();
}
sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'||ev==='INITIAL_SESSION')setTimeout(()=>start(s),0)});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&startedFor&&!document.activeElement?.matches('input')){if(await loadAll())render()}});
</script>
</body></html>
